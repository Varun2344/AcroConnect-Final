# Unified Render "Infrastructure as Code" config for AcroConnect
# This single web service runs both the Django API and Streamlit UI.
services:
  - type: web
    name: acroconnect
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        scope: env
      - key: GEMINI_API_KEY
        scope: env
      - key: DJANGO_SECRET_KEY
        scope: env
